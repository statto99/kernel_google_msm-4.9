name: Build PixelExperience Kernel
on:
  workflow_dispatch:
  push:
    branches: [ thirteen, fourteen ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          # Add i386 architecture to support 32-bit GCC 4.9 binaries
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Install core build tools and 32-bit compatibility libraries for Ubuntu 22.04
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm qemu-user-static python3 python-is-python3 libarchive-tools \
          libc6-i386 lib32z1 lib32stdc++6 libncurses5:i386 libstdc++6:i386

      - name: Download Toolchains
        run: |
          mkdir toolchains
          cd toolchains
          # Proton Clang for the C compiler
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          # GCC 4.9 for Binutils (Assembler, Linker, NM)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel
        run: |
          ROOT_DIR=$(pwd)
          OUT_DIR=$ROOT_DIR/out
          TC_DIR=$ROOT_DIR/toolchains
          
          # Setup paths
          CLANG_BIN=$TC_DIR/clang/bin
          GCC64_BIN=$TC_DIR/gcc64/bin
          GCC32_BIN=$TC_DIR/gcc32/bin
          
          # Add toolchains to PATH
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$($CLANG_BIN/clang --version | head -n 1)"
          
          # Clean and Config
          make O=$OUT_DIR clean
          make O=$OUT_DIR mrproper
          make O=$OUT_DIR bonito_defconfig
          
          # THE FIX:
          # 1. CC=clang: Use Clang for C compilation.
          # 2. CROSS_COMPILE: Points to GCC 4.9 for the main kernel binutils.
          # 3. CROSS_COMPILE_ARM32: Points to GCC 32-bit for the VDSO32 layer.
          # 4. AS/LD/NM/etc: Explicitly forced to GCC to avoid the Clang "-EL" error.
          make -j$(nproc --all) O=$OUT_DIR \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      AS=aarch64-linux-android-as \
                      LD=aarch64-linux-android-ld \
                      AR=aarch64-linux-android-ar \
                      NM=aarch64-linux-android-nm \
                      OBJCOPY=aarch64-linux-android-objcopy \
                      OBJDUMP=aarch64-linux-android-objdump \
                      STRIP=aarch64-linux-android-strip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-3a-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
