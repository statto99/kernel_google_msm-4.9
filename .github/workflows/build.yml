name: Build PixelExperience Kernel
on:
  workflow_dispatch:
  push:
    branches: [ thirteen, fourteen ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm qemu-user-static python3 python-is-python3 libarchive-tools

      - name: Download Toolchains
        run: |
          mkdir toolchains
          cd toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel
        run: |
          TC_DIR=$(pwd)/toolchains
          
          # Add all toolchain bin directories to PATH
          export PATH="$TC_DIR/clang/bin:$TC_DIR/gcc64/bin:$TC_DIR/gcc32/bin:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Clean build environment
          make O=out clean
          make O=out mrproper
          
          # Generate config
          make O=out bonito_defconfig
          
          # THE FIX: Explicitly define the binutils to use the GCC ones
          # This prevents the "nm not found" and "unrecognized option -EL" errors
          make -j$(nproc --all) O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      LD=aarch64-linux-android-ld \
                      AR=aarch64-linux-android-ar \
                      OBJCOPY=aarch64-linux-android-objcopy \
                      OBJDUMP=aarch64-linux-android-objdump \
                      STRIP=aarch64-linux-android-strip \
                      NM=aarch64-linux-android-nm

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-3a-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
