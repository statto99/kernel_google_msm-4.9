name: Build PixelExperience Kernel
on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [ thirteen, fourteen ] # Adjust to your active branch

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm qemu-user-static python3 python-is-python3

      - name: Download Toolchains
        run: |
          mkdir toolchains
          cd toolchains
          # Clone Proton Clang (often preferred for 4.9 kernels) or AOSP Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          # Clone GCC for AArch64 and ARM
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel
        run: |
          # Set paths to toolchains
          TC_DIR=$(pwd)/toolchains
          export PATH="$TC_DIR/clang/bin:$TC_DIR/gcc64/bin:$TC_DIR/gcc32/bin:$PATH"
          
          # Build variables
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Configuration (using b4s4 for Pixel 3a/3a XL)
          make O=out b4s4_defconfig
          
          # Actual Compilation
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Check for Output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build failed, output not found."
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Kernel-Image
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
