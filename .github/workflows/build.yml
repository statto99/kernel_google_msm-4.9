name: Build PixelExperience Kernel
on:
  workflow_dispatch:
  push:
    branches: [ thirteen, fourteen ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm qemu-user-static python3 python-is-python3 libarchive-tools

      - name: Download Toolchains
        run: |
          mkdir toolchains
          cd toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel
        run: |
          # Use absolute paths for stability
          ROOT_DIR=$(pwd)
          TC_DIR=$ROOT_DIR/toolchains
          OUT_DIR=$ROOT_DIR/out
          
          # Add toolchains to PATH
          export PATH="$TC_DIR/clang/bin:$TC_DIR/gcc64/bin:$TC_DIR/gcc32/bin:$PATH"
          
          # Setup Build Variables
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          
          # Clean and Config
          make O=$OUT_DIR clean
          make O=$OUT_DIR mrproper
          make O=$OUT_DIR bonito_defconfig
          
          # THE FIX: 
          # 1. Use LLVM binutils (llvm-nm, ld.lld) for the main 64-bit kernel
          # 2. Pass CROSS_COMPILE_ARM32 for the 32-bit VDSO
          # 3. Use CLANG_TRIPLE to help Clang understand the target architecture
          make -j$(nproc --all) O=$OUT_DIR \
                      CC=clang \
                      HOSTCC=clang \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      LD=ld.lld \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      HOSTCFLAGS="-fuse-ld=lld -Wno-unused-command-line-argument"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-3a-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
