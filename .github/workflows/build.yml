name: Build PixelExperience Kernel
on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push:
    branches: [ thirteen, fourteen ] # Triggers on push to these branches

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm qemu-user-static python3 python-is-python3 libarchive-tools

      - name: Download Toolchains
        run: |
          mkdir toolchains
          cd toolchains
          # Proton Clang: Optimized for Android Kernels
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          # AOSP GCC: Required for cross-compilation headers/assembler
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel
        run: |
          # Set up the environment
          TC_DIR=$(pwd)/toolchains
          export PATH="$TC_DIR/clang/bin:$TC_DIR/gcc64/bin:$TC_DIR/gcc32/bin:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Clean any previous artifacts
          make O=out clean
          make O=out mrproper
          
          # 1. Generate the config using the verified bonito_defconfig
          make O=out bonito_defconfig
          
          # 2. Build the image (Image.gz-dtb)
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Check Build Output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "SUCCESS: Kernel image found!"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "SUCCESS: Image.gz found (no DTB)!"
          else
            echo "ERROR: Kernel build failed. Check logs above."
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-3a-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
